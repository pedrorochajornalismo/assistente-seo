<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Títulos e SEO - ES Hoje</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc; /* bg-slate-50 */
        }
        
        /* Spinner Animation */
        .loader {
            border: 3px solid #f3f3f3;
            border-bottom-color: #3b82f6; /* blue-500 */
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
        }
        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-blue-900 text-white py-6 shadow-md">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between">
            <div>
                <h1 class="text-2xl font-bold tracking-tight">ES Hoje - Assistente de SEO e Títulos</h1>
                <p class="text-blue-200 text-sm mt-1">Gerador automático otimizado para a redação</p>
            </div>
            <!-- Jornalismo Icon -->
            <div class="hidden sm:block opacity-80">
                <svg xmlns="http://www.w3.org/Dom/2000/svg" width="32" height="32" fill="currentColor" viewBox="0 0 256 256">
                    <path d="M216,40H40A16,16,0,0,0,24,56V200a16,16,0,0,0,16,16H216a16,16,0,0,0,16-16V56A16,16,0,0,0,216,40Zm0,160H40V56H216V200ZM176,88a8,8,0,0,1-8,8H88a8,8,0,0,1,0-16h80A8,8,0,0,1,176,88Zm0,32a8,8,0,0,1-8,8H88a8,8,0,0,1,0-16h80A8,8,0,0,1,176,120Zm0,32a8,8,0,0,1-8,8H88a8,8,0,0,1,0-16h80A8,8,0,0,1,176,152Z"></path>
                </svg>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="p-6 sm:p-8">
                
                <h2 class="text-lg font-semibold text-slate-800 mb-4">1. Preencha as informações da matéria:</h2>
                
                <!-- Error Message Container -->
                <div id="errorMessage" class="hidden mb-4 p-3 bg-red-50 text-red-700 text-sm rounded-lg border border-red-200 flex items-center">
                    <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path></svg>
                    <span id="errorText">Por favor, insira os dados antes de continuar.</span>
                </div>

                <!-- Input Fields (Keyword and Title) -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                    <div>
                        <label for="keywordInput" class="block text-sm font-medium text-slate-700 mb-1">Palavra-chave (Usado para Títulos)</label>
                        <input type="text" id="keywordInput" 
                            class="w-full p-3 text-slate-700 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors" 
                            placeholder="Ex: Eleições Vitória, Casagrande, etc.">
                    </div>
                    <div>
                        <label for="chosenTitleInput" class="block text-sm font-medium text-slate-700 mb-1">Título Escolhido (Usado para SEO)</label>
                        <input type="text" id="chosenTitleInput" 
                            class="w-full p-3 text-slate-700 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors" 
                            placeholder="Cole aqui o título que você decidiu usar...">
                    </div>
                </div>

                <!-- Textarea -->
                <label for="articleInput" class="block text-sm font-medium text-slate-700 mb-1">Texto da Matéria</label>
                <textarea id="articleInput" 
                    class="w-full h-64 p-4 text-slate-700 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors resize-y text-base" 
                    placeholder="Cole aqui o texto completo da matéria..."></textarea>
                
                <!-- Action Buttons -->
                <div class="mt-6 flex flex-col sm:flex-row gap-4">
                    <button id="btnTitle" onclick="processText('title')" 
                        class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-6 rounded-lg transition-colors flex justify-center items-center gap-2 shadow-sm">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                        Gerar Títulos (Máx 60 carac.)
                    </button>
                    
                    <button id="btnSEO" onclick="processText('seo')" 
                        class="flex-1 bg-teal-600 hover:bg-teal-700 text-white font-medium py-3 px-6 rounded-lg transition-colors flex justify-center items-center gap-2 shadow-sm">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                        Gerar SEO (Rank Math)
                    </button>
                </div>
            </div>
            
            <!-- Loading State -->
            <div id="loadingState" class="hidden border-t border-slate-100 bg-slate-50 p-8 flex flex-col items-center justify-center text-slate-500">
                <span class="loader w-8 h-8 mb-4"></span>
                <p id="loadingText" class="font-medium animate-pulse">Analisando matéria e gerando sugestões...</p>
            </div>

            <!-- Result Area -->
            <div id="resultArea" class="hidden border-t border-slate-200 bg-white">
                <div class="p-6 sm:p-8">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-lg font-semibold text-slate-800">Resultado Gerado:</h2>
                        
                        <!-- Copy Notification Toast (Inline) -->
                        <span id="copyToast" class="hidden text-sm text-green-600 font-medium flex items-center bg-green-50 px-2 py-1 rounded">
                            <svg class="w-4 h-4 mr-1" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path></svg>
                            Copiado!
                        </span>
                    </div>
                    
                    <div class="relative group">
                        <!-- We use a hidden textarea for reliable execCommand('copy') as requested by guidelines -->
                        <textarea id="hiddenCopyText" class="absolute w-0 h-0 opacity-0 pointer-events-none" aria-hidden="true"></textarea>
                        
                        <div id="outputContent" class="w-full min-h-[100px] p-5 text-slate-800 bg-slate-50 border border-slate-200 rounded-lg text-base whitespace-pre-wrap leading-relaxed">
                            <!-- Output injected here via JS -->
                        </div>
                    </div>
                    
                    <div class="mt-6 flex justify-end">
                        <button onclick="copyToClipboard()" class="bg-slate-800 hover:bg-slate-900 text-white font-medium py-2 px-5 rounded-lg transition-colors flex items-center gap-2 shadow-sm">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                            Copiar Resultado
                        </button>
                    </div>
                </div>
            </div>
            
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-100 py-6 mt-auto border-t border-slate-200 text-center text-slate-500 text-sm">
        <p>Desenvolvido para uso interno da redação - ES Hoje</p>
    </footer>

    <script>
        // DOM Elements
        const articleInput = document.getElementById('articleInput');
        const keywordInput = document.getElementById('keywordInput');
        const chosenTitleInput = document.getElementById('chosenTitleInput');
        const btnTitle = document.getElementById('btnTitle');
        const btnSEO = document.getElementById('btnSEO');
        const loadingState = document.getElementById('loadingState');
        const resultArea = document.getElementById('resultArea');
        const outputContent = document.getElementById('outputContent');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');
        const hiddenCopyText = document.getElementById('hiddenCopyText');
        const copyToast = document.getElementById('copyToast');

        // Main processing function
        async function processText(mode) {
            const text = articleInput.value.trim();
            const keyword = keywordInput.value.trim();
            const chosenTitle = chosenTitleInput.value.trim();
            
            // Validation
            if (!text) {
                showError('Por favor, cole o texto da matéria antes de solicitar a geração.');
                return;
            }

            if (mode === 'title' && !keyword) {
                showError('Para gerar títulos otimizados, por favor preencha o campo "Palavra-chave".');
                return;
            }

            if (mode === 'seo' && !chosenTitle) {
                showError('Para gerar o SEO do Rank Math, por favor preencha o campo "Título Escolhido".');
                return;
            }

            // Hide errors and results, show loading
            hideError();
            resultArea.classList.add('hidden');
            loadingState.classList.remove('hidden');
            
            // Disable inputs during processing
            setButtonsState(true);

            // Prepare Prompts based on selected mode
            let userQuery = "";

            if (mode === 'title') {
                userQuery = `Papel: Você é o editor de SEO do ES Hoje sugerindo títulos. Contexto: O título tem até 60 caracteres. Número que carrega peso de notícia pode abrir o título; número decorativo fica no meio ou no fim. Clickbait é permitido, com um limite único: o título nunca promete algo que o texto não entrega. Palavra-chave: ${keyword} Expectativa: Gere cinco opções de título para a matéria abaixo, cada uma com a palavra-chave. Formato: Lista numerada, com a contagem de caracteres ao lado de cada opção. Nada além da lista. Restrições: Nenhuma opção pode passar de 60 caracteres. Nenhuma pode prometer informação que não está no texto. Esclarecimento: Se o texto não tiver um fato forte para abrir o título, devolva a lista mesmo assim e marque com um asterisco a opção mais segura. Informações: ${text}`;
            } else if (mode === 'seo') {
                userQuery = `Papel: Você é o editor de SEO preenchendo os campos do Rank Math. Contexto: A meta descrição resume a matéria, contém a palavra-chave foco e respeita o limite de caracteres do manual. O slug é curto, em português, sem palavras desnecessárias. Título escolhido: ${chosenTitle} Expectativa: A partir do texto abaixo, gere os três campos: meta descrição, slug, palavra-chave foco. Formato: Três linhas, cada uma rotulada (Meta descrição com 920 px/ Slug com 25 caracteres / Palavra-chave foco). Nada além disso. Restrições: A meta descrição não pode ser cópia do título. O slug não pode ter acento, caractere especial ou data. Esclarecimento: Se o texto tocar mais de um tema forte, escolha o foco mais forte pelo peso da matéria e sinalize a segunda opção entre parênteses na linha da palavra-chave. Informações: ${text}`;
            }

            // API Payload Configuration
            const payload = {
                contents: [{ parts: [{ text: userQuery }] }]
            };

            // Canvas environment will automatically inject API key when it is an empty string
            const apiKey = ""; 
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            try {
                // Implementing exponential backoff logic as a best practice for API calls
                let response = null;
                let retries = 3;
                let delay = 1000;

                for (let i = 0; i < retries; i++) {
                    response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (response.ok) break;
                    if (response.status === 429) {
                        await new Promise(r => setTimeout(r, delay));
                        delay *= 2;
                    } else {
                        break;
                    }
                }

                if (!response || !response.ok) {
                    throw new Error('Falha na comunicação com a Inteligência Artificial. Tente novamente.');
                }

                const result = await response.json();
                const generatedText = result.candidates?.[0]?.content?.parts?.[0]?.text;

                if (generatedText) {
                    displayResult(generatedText);
                } else {
                    throw new Error('A Inteligência Artificial não retornou uma resposta válida.');
                }

            } catch (error) {
                showError(error.message || 'Ocorreu um erro inesperado ao gerar o conteúdo.');
            } finally {
                // Restore UI state
                loadingState.classList.add('hidden');
                setButtonsState(false);
            }
        }

        // UI Helpers
        function setButtonsState(disabled) {
            articleInput.disabled = disabled;
            keywordInput.disabled = disabled;
            chosenTitleInput.disabled = disabled;
            btnTitle.disabled = disabled;
            btnSEO.disabled = disabled;
            
            if (disabled) {
                btnTitle.classList.add('opacity-70', 'cursor-not-allowed');
                btnSEO.classList.add('opacity-70', 'cursor-not-allowed');
                articleInput.classList.add('opacity-70', 'bg-slate-100');
                keywordInput.classList.add('opacity-70', 'bg-slate-100');
                chosenTitleInput.classList.add('opacity-70', 'bg-slate-100');
            } else {
                btnTitle.classList.remove('opacity-70', 'cursor-not-allowed');
                btnSEO.classList.remove('opacity-70', 'cursor-not-allowed');
                articleInput.classList.remove('opacity-70', 'bg-slate-100');
                keywordInput.classList.remove('opacity-70', 'bg-slate-100');
                chosenTitleInput.classList.remove('opacity-70', 'bg-slate-100');
            }
        }

        function displayResult(text) {
            // Format text (convert markdown bold to HTML strong for better display, but keep plain text for copying)
            let formattedHtml = text
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\n/g, '<br>');
                
            outputContent.innerHTML = formattedHtml;
            hiddenCopyText.value = text; // Keep raw text (with asterisks or pure text) for clipboard
            
            resultArea.classList.remove('hidden');
            
            // Scroll to result smoothly
            resultArea.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function showError(msg) {
            errorText.textContent = msg;
            errorMessage.classList.remove('hidden');
            // Scroll to top
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function hideError() {
            errorMessage.classList.add('hidden');
        }

        // Copy to clipboard functionality using execCommand as fallback
        function copyToClipboard() {
            hiddenCopyText.select();
            hiddenCopyText.setSelectionRange(0, 99999); /* For mobile devices */

            let success = false;
            try {
                success = document.execCommand('copy');
            } catch (err) {
                console.error('Falha ao copiar texto: ', err);
            }

            // Deselect
            window.getSelection().removeAllRanges();

            if (success) {
                // Show toast
                copyToast.classList.remove('hidden');
                setTimeout(() => {
                    copyToast.classList.add('hidden');
            }, 2500);
            } else {
                showError('Não foi possível copiar o texto automaticamente. Por favor, selecione e copie manualmente.');
            }
        }
    </script>
</body>
</html>
