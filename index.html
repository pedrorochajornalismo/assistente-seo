<script>
        document.addEventListener("DOMContentLoaded", () => {
            const savedKey = localStorage.getItem('esHojeGeminiKey');
            if(savedKey) document.getElementById('apiKey').value = savedKey;
        });

        async function gerar(tipo) {
            const apiKey = document.getElementById('apiKey').value.trim();
            const materia = document.getElementById('materia').value.trim();
            const palavraChave = document.getElementById('palavraChave').value.trim();
            const tituloEscolhido = document.getElementById('tituloEscolhido').value.trim();
            const resultadoDiv = document.getElementById('resultado');
            const botoes = document.querySelectorAll('button');

            if (!apiKey) {
                alert("Por favor, cole a Chave da API do Gemini no campo superior.");
                return;
            }
            if (!materia || !palavraChave) {
                alert("Por favor, preencha o texto da matéria e a palavra-chave.");
                return;
            }
            if (tipo === 'seo' && !tituloEscolhido) {
                alert("Para gerar o SEO, preencha também o Título Escolhido.");
                return;
            }

            localStorage.setItem('esHojeGeminiKey', apiKey);
            botoes.forEach(b => b.disabled = true);
            resultadoDiv.style.display = 'block';
            resultadoDiv.innerHTML = "Processando matéria... Aguarde.";

            let promptTexto = "";
            if (tipo === 'titulo') {
                promptTexto = `Papel: Você é o editor de SEO do ES Hoje sugerindo títulos. Contexto: O título tem até 60 caracteres. Número que carrega peso de notícia pode abrir o título; número decorativo fica no meio ou no fim. Clickbait é permitido, com um limite único: o título nunca promete algo que o texto não entrega. Palavra-chave: ${palavraChave} Expectativa: Gere cinco opções de título para a matéria abaixo, cada uma com a palavra-chave. Formato: Lista numerada, com a contagem de caracteres ao lado de cada opção. Nada além da lista. Restrições: Nenhuma opção pode passar de 60 caracteres. Nenhuma pode prometer informação que não está no texto. Esclarecimento: Se o texto não tiver um fato forte para abrir o título, devolva a lista mesmo assim e marque com um asterisco a opção mais segura. Informações: ${materia}`;
            } else {
                promptTexto = `Papel: Você é o editor de SEO preenchendo os campos do Rank Math. Contexto: A meta descrição resume a matéria, contém a palavra-chave foco e respeita o limite de caracteres do manual. O slug é curto, em português, sem palavras desnecessárias. Título escolhido: ${tituloEscolhido} Expectativa: A partir do texto abaixo, gere os três campos: meta descrição, slug, palavra-chave foco. Formato: Três linhas, cada uma rotulada (Meta descrição com 920 px/ Slug com 25 caracteres / Palavra-chave foco). Nada além disso. Restrições: A meta descrição não pode ser cópia do título. O slug não pode ter acento, caractere especial ou data. Esclarecimento: Se o texto tocar mais de um tema forte, escolha o foco mais forte pelo peso da matéria e sinalize a segunda opção entre parênteses na linha da palavra-chave. Informações: ${materia}`;
            }

            const url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=" + apiKey;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: promptTexto }] }]
                    })
                });

                if (!response.ok) {
                    throw new Error(`Erro de autenticação ou falha na API (${response.status})`);
                }

                const data = await response.json();
                resultadoDiv.innerHTML = data.candidates[0].content.parts[0].text;
            } catch (error) {
                resultadoDiv.innerHTML = `<span style="color: red;">Falha na comunicação: Verifique se a sua Chave da API está correta e tente novamente.</span>`;
            } finally {
                botoes.forEach(b => b.disabled = false);
            }
        }
    </script>
